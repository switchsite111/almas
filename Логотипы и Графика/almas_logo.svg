<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 550" width="100%" height="100%">
  <defs>
    <linearGradient id="blue-grad-left" x1="0%" y1="100%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#0035cb" />
      <stop offset="100%" stop-color="#00a3e0" />
    </linearGradient>
    <linearGradient id="blue-grad-right" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#00a3e0" />
      <stop offset="100%" stop-color="#002b9e" />
    </linearGradient>
    <linearGradient id="diamond-top" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#00259e" />
      <stop offset="100%" stop-color="#0055d4" />
    </linearGradient>
    <linearGradient id="diamond-bottom" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#00b4d8" />
      <stop offset="100%" stop-color="#0077b6" />
    </linearGradient>
    <filter id="glow-effect" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="8" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <g transform="translate(0, 0)">
    <!-- LEFT 'A' WING -->
    <path d="M 60 520 L 370 20 L 440 20 L 210 520 Z" fill="url(#blue-grad-left)" />
    <path d="M 210 520 L 370 200 L 400 200 L 330 520 Z" fill="url(#blue-grad-left)" opacity="0.95" />
    
    <!-- RIGHT 'A' WING -->
    <path d="M 740 520 L 430 20 L 360 20 L 590 520 Z" fill="url(#blue-grad-right)" />
    <path d="M 590 520 L 430 200 L 400 200 L 470 520 Z" fill="url(#blue-grad-right)" opacity="0.95" />

    <!-- HORIZONTAL CROSSBARS FOR 'A' STRUCTURES -->
    <polygon points="340,470 460,470 440,520 360,520" fill="#0088d4" />
    
    <!-- CENTRAL ALMAS DIAMOND GEM -->
    <g filter="url(#glow-effect)">
      <!-- Top Diamond Triangle -->
      <polygon points="400,180 435,265 365,265" fill="url(#diamond-top)" />
      <!-- Bottom Diamond Triangle -->
      <polygon points="400,350 435,265 365,265" fill="url(#diamond-bottom)" />
      <!-- Center Split Highlights -->
      <polygon points="400,180 435,265 400,265" fill="#00b4d8" opacity="0.8" />
      <polygon points="400,265 435,265 400,350" fill="#0077b6" opacity="0.9" />
    </g>
  </g>
</svg>
